name: Build Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # ============================================================
      # 4. Verify source
      # ============================================================

      - name: Verify source
        run: |
          echo "========================================"
          echo "COMMIT"
          echo "========================================"
          git rev-parse HEAD

          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          pwd
          ls -la

          echo "========================================"
          echo "HOME PAGE"
          echo "========================================"

          if [ ! -f "lib/presentation/pages/home_page.dart" ]; then
            echo "ERROR: home_page.dart not found"
            exit 1
          fi

          sha256sum lib/presentation/pages/home_page.dart

          grep -n "دسترسی سریع" \
            lib/presentation/pages/home_page.dart || true

          grep -n "مراقبت‌های پیش رو" \
            lib/presentation/pages/home_page.dart || true

          grep -n "افراد تحت پوشش" \
            lib/presentation/pages/home_page.dart || true

      # ============================================================
      # 5. Create Android platform if missing
      # ============================================================

      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "========================================"
            echo "ANDROID FOLDER NOT FOUND"
            echo "Creating Android platform..."
            echo "========================================"

            flutter create . \
              --project-name khane_behdasht \
              --org ir.khane.behdasht \
              --platforms android
          else
            echo "========================================"
            echo "ANDROID FOLDER EXISTS"
            echo "========================================"
          fi

          echo ""
          echo "===== ANDROID ROOT ====="
          ls -la android

          echo ""
          echo "===== ANDROID APP ====="
          ls -la android/app

      # ============================================================
      # 6. Configure Core Library Desugaring
      # ============================================================

      - name: Configure core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              print("Using Groovy Gradle:")
              print(groovy)

              text = groovy.read_text(encoding="utf-8")

              # ----------------------------------------------------
              # Enable core library desugaring
              # ----------------------------------------------------

              if "coreLibraryDesugaringEnabled true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
          coreLibraryDesugaringEnabled true""",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          """android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }""",
                          1,
                      )

              # ----------------------------------------------------
              # Add desugaring dependency
              # ----------------------------------------------------

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'"
              )

              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          """dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'""",
                          1,
                      )
                  else:
                      text += """
          
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          }
          """

              groovy.write_text(
                  text,
                  encoding="utf-8",
              )

              print("===== FINAL build.gradle =====")
              print(text)

          elif kotlin.exists():
              print("Using Kotlin Gradle DSL:")
              print(kotlin)

              text = kotlin.read_text(encoding="utf-8")

              # ----------------------------------------------------
              # Enable core library desugaring
              # ----------------------------------------------------

              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
          isCoreLibraryDesugaringEnabled = true""",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          """android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }""",
                          1,
                      )

              # ----------------------------------------------------
              # Add desugaring dependency
              # ----------------------------------------------------

              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.5"'
                  ')'
              )

              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          """dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")""",
                          1,
                      )
                  else:
                      text += """
          
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

              kotlin.write_text(
                  text,
                  encoding="utf-8",
              )

              print("===== FINAL build.gradle.kts =====")
              print(text)

          else:
              raise SystemExit(
                  "ERROR: Neither android/app/build.gradle "
                  "nor android/app/build.gradle.kts exists."
              )
          PY

      # ============================================================
      # 7. Verify Desugaring configuration
      # ============================================================

      - name: Verify desugaring configuration
        run: |
          echo "========================================"
          echo "VERIFY DESUGARING"
          echo "========================================"

          if [ -f "android/app/build.gradle" ]; then
            grep -n "coreLibraryDesugaring" \
              android/app/build.gradle || true

          elif [ -f "android/app/build.gradle.kts" ]; then
            grep -n "coreLibraryDesugaring" \
              android/app/build.gradle.kts || true
          fi

      # ============================================================
      # 8. Clean
      # ============================================================

      - name: Flutter clean
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      # ============================================================
      # 9. Dependencies
      # ============================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ============================================================
      # 10. Analyze
      # ============================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ============================================================
      # 11. Tests
      # ============================================================

      - name: Flutter tests
        run: |
          flutter test

      # ============================================================
      # 12. Build APK
      # ============================================================

      - name: Build Release APK
        run: |
          flutter build apk --release

      # ============================================================
      # 13. Build AAB
      # ============================================================

      - name: Build Release AAB
        run: |
          flutter build appbundle --release

      # ============================================================
      # 14. Check outputs
      # ============================================================

      - name: Check build outputs
        run: |
          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/

          echo ""
          echo "========================================"
          echo "AAB"
          echo "========================================"

          ls -lh build/app/outputs/bundle/release/

          echo ""
          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum \
            build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 15. Upload
      # ============================================================

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
