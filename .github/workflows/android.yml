name: Build Android Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # ==========================================
      # 4. Python dependencies
      # ==========================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow


      # ==========================================
      # 5. Flutter
      # ==========================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # 6. Flutter information
      # ==========================================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # ==========================================
      # 7. Verify project files
      # ==========================================
      - name: Check project
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo "===== LIB ====="
          ls -la lib || true

          echo "===== PUBSPEC ====="
          test -f pubspec.yaml && echo "pubspec.yaml found"

          echo "===== ANDROID ====="
          ls -la android || true


      # ==========================================
      # 8. Create Android platform if necessary
      # ==========================================
      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist."
            echo "Creating Android platform..."
            flutter create . --platforms=android --org ir.khane.behdasht
          else
            echo "Android folder already exists."
          fi


      # ==========================================
      # 9. Configure Android
      # ==========================================
      - name: Configure Android
        run: |
          if [ -f "tool/prepare_android.py" ]; then
            python3 tool/prepare_android.py
          else
            echo "prepare_android.py not found - skipping."
          fi


      # ==========================================
      # 10. Create application icon
      # ==========================================
      - name: Generate application icon
        run: |
          if [ -f "tool/create_icon.py" ]; then
            python3 tool/create_icon.py
          else
            echo "create_icon.py not found - skipping."
          fi


      # ==========================================
      # 11. Flutter dependencies
      # ==========================================
      - name: Flutter pub get
        run: |
          flutter pub get


      # ==========================================
      # 12. Analyze
      # ==========================================
      - name: Flutter analyze
        run: |
          flutter analyze


      # ==========================================
      # 13. Tests
      # ==========================================
      - name: Flutter tests
        run: |
          flutter test


      # ==========================================
      # 14. Build APK
      # ==========================================
      - name: Build Release APK
        run: |
          flutter build apk --release


      # ==========================================
      # 15. Build AAB
      # ==========================================
      - name: Build Release AAB
        run: |
          flutter build appbundle --release


      # ==========================================
      # 16. Check outputs
      # ==========================================
      - name: Check build outputs
        run: |
          echo "================================"
          echo "APK OUTPUT"
          echo "================================"

          ls -lh build/app/outputs/flutter-apk/

          echo "================================"
          echo "AAB OUTPUT"
          echo "================================"

          ls -lh build/app/outputs/bundle/release/


      # ==========================================
      # 17. Upload APK and AAB
      # ==========================================
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
