name: Build Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter version
        run: flutter --version

      - name: Check source
        run: |
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo "===== HOME PAGE ====="
          if [ ! -f lib/presentation/pages/home_page.dart ]; then
            echo "ERROR: home_page.dart not found"
            exit 1
          fi

          sha256sum lib/presentation/pages/home_page.dart

          echo "===== HOME PAGE TEXT ====="
          grep -n "دسترسی سریع" lib/presentation/pages/home_page.dart || true
          grep -n "مراقبت‌های پیش رو" lib/presentation/pages/home_page.dart || true
          grep -n "افراد تحت پوشش" lib/presentation/pages/home_page.dart || true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Check build outputs
        run: |
          echo "===== APK ====="
          ls -lh build/app/outputs/flutter-apk/

          echo "===== AAB ====="
          ls -lh build/app/outputs/bundle/release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
