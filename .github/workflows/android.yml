name: Build Android Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. دریافت کد پروژه
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # 2. نصب Java 17
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------
      # 3. نصب Python
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # --------------------------------
      # 4. نصب Pillow
      # برای ساخت آیکون برنامه
      # --------------------------------
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow


      # --------------------------------
      # 5. نصب Flutter
      # --------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # --------------------------------
      # 6. بررسی Flutter و Dart
      # --------------------------------
      - name: Verify Flutter
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # --------------------------------
      # 7. ساخت Android platform
      # --------------------------------
      - name: Create Android platform
        run: |
          flutter create . \
            --platforms=android \
            --org ir.khane.behdasht


      # --------------------------------
      # 8. تنظیم Android پروژه
      # --------------------------------
      - name: Configure Android
        run: |
          python3 tool/prepare_android.py


      # --------------------------------
      # 9. ساخت آیکون برنامه
      # --------------------------------
      - name: Generate app icon
        run: |
          python3 tool/create_icon.py


      # --------------------------------
      # 10. دریافت package ها
      # --------------------------------
      - name: Get Flutter dependencies
        run: |
          flutter pub get


      # --------------------------------
      # 11. بررسی کد
      # --------------------------------
      - name: Analyze Flutter project
        run: |
          flutter analyze


      # --------------------------------
      # 12. اجرای تست ها
      # --------------------------------
      - name: Run Flutter tests
        run: |
          flutter test


      # --------------------------------
      # 13. ساخت APK Release
      # --------------------------------
      - name: Build Release APK
        run: |
          flutter build apk \
            --release


      # --------------------------------
      # 14. ساخت Android App Bundle
      # --------------------------------
      - name: Build Release AAB
        run: |
          flutter build appbundle \
            --release


      # --------------------------------
      # 15. نمایش فایل های خروجی
      # --------------------------------
      - name: List build outputs
        run: |
          echo "===== APK ====="
          ls -lh build/app/outputs/flutter-apk/

          echo "===== AAB ====="
          ls -lh build/app/outputs/bundle/release/


      # --------------------------------
      # 16. ذخیره APK و AAB
      # --------------------------------
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
