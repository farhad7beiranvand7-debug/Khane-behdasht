name: Build Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inspect project
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== PUBSPEC ====="
          if [ -f pubspec.yaml ]; then
            cat pubspec.yaml
          else
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

      - name: Fix Dart package name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()
          found = False

          for i, line in enumerate(lines):
              if line.startswith("name:"):
                  lines[i] = "name: khane_behdasht"
                  found = True
                  break

          if not found:
              raise SystemExit("ERROR: name field not found in pubspec.yaml")

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(path.read_text(encoding="utf-8"))
          PY

      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist."
            echo "Creating Android platform..."

            flutter create . \
              --project-name khane_behdasht \
              --org ir.khane.behdasht \
              --platforms android
          else
            echo "Android folder already exists."
          fi

      - name: Inspect Android Gradle files
        run: |
          echo "===== ANDROID ROOT ====="
          ls -la android

          echo "===== ANDROID APP ====="
          if [ -d android/app ]; then
            ls -la android/app
          else
            echo "ERROR: android/app directory not found"
            exit 1
          fi

          echo "===== ALL GRADLE FILES ====="
          find android -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            -print

      - name: Configure Android
        run: |
          if [ -f "tool/prepare_android.py" ]; then
            echo "Running prepare_android.py"
            python3 tool/prepare_android.py
          else
            echo "prepare_android.py not found."
            echo "Skipping custom Android configuration."
          fi

      - name: Configure core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              print("Using Groovy Gradle file:")
              print(groovy)

              text = groovy.read_text(encoding="utf-8")

              # Enable desugaring.
              if "coreLibraryDesugaringEnabled true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          "compileOptions {\n"
                          "        coreLibraryDesugaringEnabled true",
                          1,
                      )
                  else:
                      marker = "android {"
                      if marker in text:
                          text = text.replace(
                              marker,
                              marker
                              + "\n    compileOptions {\n"
                              + "        coreLibraryDesugaringEnabled true\n"
                              + "    }",
                              1,
                          )

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'"
              )

              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n        " + dependency,
                          1,
                      )
                  else:
                      text += (
                          "\n\ndependencies {\n"
                          "    " + dependency + "\n"
                          "}\n"
                      )

              groovy.write_text(text, encoding="utf-8")
              print(text)

          elif kotlin.exists():
              print("Using Kotlin DSL Gradle file:")
              print(kotlin)

              text = kotlin.read_text(encoding="utf-8")

              # Enable desugaring.
              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          "compileOptions {\n"
                          "        isCoreLibraryDesugaringEnabled = true",
                          1,
                      )
                  else:
                      marker = "android {"
                      if marker in text:
                          text = text.replace(
                              marker,
                              marker
                              + "\n    compileOptions {\n"
                              + "        isCoreLibraryDesugaringEnabled = true\n"
                              + "    }",
                              1,
                          )

              dependency = (
                  'coreLibraryDesugaring("'
                  "com.android.tools:desugar_jdk_libs:2.1.5"
                  '")'
              )

              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n        " + dependency,
                          1,
                      )
                  else:
                      text += (
                          "\n\ndependencies {\n"
                          "    " + dependency + "\n"
                          "}\n"
                      )

              kotlin.write_text(text, encoding="utf-8")
              print(text)

          else:
              raise SystemExit(
                  "ERROR: Neither android/app/build.gradle nor "
                  "android/app/build.gradle.kts exists."
              )
          PY

      - name: Generate application icon
        run: |
          if [ -f "tool/create_icon.py" ]; then
            echo "Running create_icon.py"
            python3 tool/create_icon.py
          else
            echo "create_icon.py not found."
            echo "Skipping custom icon generation."
          fi

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Flutter analyze
        run: |
          flutter analyze

      - name: Flutter tests
        run: |
          flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Build Release AAB
        run: |
          flutter build appbundle --release

      - name: Check build outputs
        run: |
          echo "===== APK ====="
          ls -lh build/app/outputs/flutter-apk/

          echo "===== AAB ====="
          ls -lh build/app/outputs/bundle/release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
