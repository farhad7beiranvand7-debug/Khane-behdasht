name: Build Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. IDENTIFY EXACT SOURCE
      # ============================================================

      - name: Identify source commit
        run: |
          echo "========================================"
          echo "SOURCE INFORMATION"
          echo "========================================"

          echo "Repository:"
          git remote -v

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Short commit:"
          git rev-parse --short HEAD

          echo ""
          echo "Commit message:"
          git log -1 --pretty=%B

          echo ""
          echo "Git status:"
          git status --short

          echo ""
          echo "GitHub SHA:"
          echo "${GITHUB_SHA}"

          echo ""
          echo "GitHub ref:"
          echo "${GITHUB_REF}"

      # ============================================================
      # 3. CHECK IMPORTANT SOURCE FILES
      # ============================================================

      - name: Verify source files
        run: |
          echo "========================================"
          echo "SOURCE FILE CHECK"
          echo "========================================"

          echo "===== main.dart ====="

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart not found"
            exit 1
          fi

          sha256sum lib/main.dart

          echo ""
          echo "===== home_page.dart ====="

          if [ ! -f "lib/presentation/pages/home_page.dart" ]; then
            echo "ERROR: home_page.dart not found"
            exit 1
          fi

          sha256sum lib/presentation/pages/home_page.dart

          echo ""
          echo "===== main.dart content ====="

          cat lib/main.dart

          echo ""
          echo "===== HomePage references ====="

          grep -R "HomePage" -n lib || true

          echo ""
          echo "===== home_page.dart first lines ====="

          sed -n '1,80p' lib/presentation/pages/home_page.dart

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 5. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      # ============================================================
      # 6. FLUTTER
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      # ============================================================
      # 7. PROJECT CHECK
      # ============================================================

      - name: Inspect project
        run: |
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"

          pwd
          ls -la

          echo ""
          echo "===== PUBSPEC ====="

          if [ -f pubspec.yaml ]; then
            cat pubspec.yaml
          else
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

      # ============================================================
      # 8. FIX PACKAGE NAME
      # ============================================================

      - name: Fix Dart package name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()
          found = False

          for i, line in enumerate(lines):
              if line.startswith("name:"):
                  lines[i] = "name: khane_behdasht"
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: name field not found in pubspec.yaml"
              )

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(path.read_text(encoding="utf-8"))
          PY

      # ============================================================
      # 9. ANDROID PLATFORM
      # ============================================================

      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist."
            echo "Creating Android platform..."

            flutter create . \
              --project-name khane_behdasht \
              --org ir.khane.behdasht \
              --platforms android
          else
            echo "Android folder already exists."
          fi

      # ============================================================
      # 10. ANDROID FILE CHECK
      # ============================================================

      - name: Inspect Android Gradle files
        run: |
          echo "========================================"
          echo "ANDROID FILES"
          echo "========================================"

          ls -la android

          if [ -d android/app ]; then
            ls -la android/app
          else
            echo "ERROR: android/app not found"
            exit 1
          fi

          find android -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # ============================================================
      # 11. CUSTOM ANDROID PREPARATION
      # ============================================================

      - name: Configure Android
        run: |
          if [ -f "tool/prepare_android.py" ]; then
            echo "Running prepare_android.py"
            python3 tool/prepare_android.py
          else
            echo "prepare_android.py not found."
            echo "Skipping custom Android configuration."
          fi

      # ============================================================
      # 12. CORE LIBRARY DESUGARING
      # ============================================================

      - name: Configure core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              print("Using Groovy Gradle file")

              text = groovy.read_text(encoding="utf-8")

              if "coreLibraryDesugaringEnabled true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          "compileOptions {\n"
                          "        coreLibraryDesugaringEnabled true",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n"
                          "    compileOptions {\n"
                          "        coreLibraryDesugaringEnabled true\n"
                          "    }",
                          1,
                      )

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'"
              )

              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n        " + dependency,
                          1,
                      )
                  else:
                      text += (
                          "\n\ndependencies {\n"
                          "    " + dependency + "\n"
                          "}\n"
                      )

              groovy.write_text(text, encoding="utf-8")
              print(text)

          elif kotlin.exists():
              print("Using Kotlin DSL Gradle file")

              text = kotlin.read_text(encoding="utf-8")

              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          "compileOptions {\n"
                          "        isCoreLibraryDesugaringEnabled = true",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n"
                          "    compileOptions {\n"
                          "        isCoreLibraryDesugaringEnabled = true\n"
                          "    }",
                          1,
                      )

              dependency = (
                  'coreLibraryDesugaring("'
                  "com.android.tools:desugar_jdk_libs:2.1.5"
                  '")'
              )

              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n        " + dependency,
                          1,
                      )
                  else:
                      text += (
                          "\n\ndependencies {\n"
                          "    " + dependency + "\n"
                          "}\n"
                      )

              kotlin.write_text(text, encoding="utf-8")
              print(text)

          else:
              raise SystemExit(
                  "ERROR: No Android Gradle file found."
              )
          PY

      # ============================================================
      # 13. ICON
      # ============================================================

      - name: Generate application icon
        run: |
          if [ -f "tool/create_icon.py" ]; then
            echo "Running create_icon.py"
            python3 tool/create_icon.py
          else
            echo "create_icon.py not found."
            echo "Skipping custom icon generation."
          fi

      # ============================================================
      # 14. CLEAN EVERYTHING
      # ============================================================

      - name: Flutter clean
        run: |
          flutter clean

          rm -rf build
          rm -rf .dart_tool

          echo "Clean completed."

      # ============================================================
      # 15. PUB GET
      # ============================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ============================================================
      # 16. VERIFY SOURCE AGAIN
      # ============================================================

      - name: Verify source before analyze
        run: |
          echo "========================================"
          echo "FINAL SOURCE VERIFICATION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "main.dart:"
          sha256sum lib/main.dart

          echo ""
          echo "home_page.dart:"
          sha256sum lib/presentation/pages/home_page.dart

          echo ""
          echo "HomePage references:"
          grep -R "HomePage" -n lib || true

      # ============================================================
      # 17. ANALYZE
      # ============================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ============================================================
      # 18. TEST
      # ============================================================

      - name: Flutter tests
        run: |
          flutter test

      # ============================================================
      # 19. BUILD APK
      # ============================================================

      - name: Build Release APK
        run: |
          flutter build apk --release

      # ============================================================
      # 20. BUILD AAB
      # ============================================================

      - name: Build Release AAB
        run: |
          flutter build appbundle --release

      # ============================================================
      # 21. IDENTIFY BUILD OUTPUT
      # ============================================================

      - name: Check build outputs
        run: |
          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo "===== APK ====="
          ls -lh build/app/outputs/flutter-apk/

          echo ""
          echo "===== AAB ====="
          ls -lh build/app/outputs/bundle/release/

      # ============================================================
      # 22. RENAME OUTPUTS WITH COMMIT SHA
      # ============================================================

      - name: Rename release files
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "Using commit: ${SHORT_SHA}"

          mv \
            build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/khane-behdasht-${SHORT_SHA}.apk"

          mv \
            build/app/outputs/bundle/release/app-release.aab \
            "build/app/outputs/bundle/release/khane-behdasht-${SHORT_SHA}.aab"

          echo ""
          echo "===== FINAL APK ====="
          ls -lh build/app/outputs/flutter-apk/

          echo ""
          echo "===== FINAL AAB ====="
          ls -lh build/app/outputs/bundle/release/

      # ============================================================
      # 23. UPLOAD ONLY THIS BUILD
      # ============================================================

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/khane-behdasht-*.apk
            build/app/outputs/bundle/release/khane-behdasht-*.aab
          if-no-files-found: error
          retention-days: 30
