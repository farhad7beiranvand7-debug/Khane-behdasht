name: Build Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # ============================================================
      # 4. Verify source
      # ============================================================

      - name: Verify source
        run: |
          echo "========================================"
          echo "COMMIT"
          echo "========================================"
          git rev-parse HEAD

          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          pwd
          ls -la

      # ============================================================
      # 5. Create Android platform if missing
      # ============================================================

      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Creating Android platform..."

            flutter create . \
              --project-name khane_behdasht \
              --org ir.khane.behdasht \
              --platforms android
          else
            echo "Android folder already exists."
          fi

          echo ""
          echo "===== ANDROID ROOT ====="
          ls -la android

          echo ""
          echo "===== ANDROID APP ====="
          ls -la android/app

      # ============================================================
      # 6. Configure core library desugaring
      # ============================================================

      - name: Configure core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():

              text = groovy.read_text(encoding="utf-8")

              if "coreLibraryDesugaringEnabled true" not in text:

                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
              coreLibraryDesugaringEnabled true""",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          """android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }""",
                          1,
                      )

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'"
              )

              if dependency not in text:

                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          """dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'""",
                          1,
                      )
                  else:
                      text += """

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          }
          """

              groovy.write_text(
                  text,
                  encoding="utf-8",
              )

              print("Updated build.gradle.")

          elif kotlin.exists():

              text = kotlin.read_text(encoding="utf-8")

              if "isCoreLibraryDesugaringEnabled = true" not in text:

                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          """compileOptions {
              isCoreLibraryDesugaringEnabled = true""",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          """android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }""",
                          1,
                      )

              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.5"'
                  ')'
              )

              if dependency not in text:

                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          """dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")""",
                          1,
                      )
                  else:
                      text += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

              kotlin.write_text(
                  text,
                  encoding="utf-8",
              )

              print("Updated build.gradle.kts.")

          else:
              raise SystemExit(
                  "Neither build.gradle nor build.gradle.kts exists."
              )
          PY

      # ============================================================
      # 7. Clean
      # ============================================================

      - name: Flutter clean
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      # ============================================================
      # 8. Dependencies
      # ============================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ============================================================
      # 9. CREATE OUR APP ICON
      # ============================================================

      - name: Generate launcher icon
        run: |
          echo "========================================"
          echo "GENERATING KHANE BEHDASHT ICON"
          echo "========================================"

          python3 -m pip install --quiet Pillow

          python3 tool/create_icon.py

          echo ""
          echo "========================================"
          echo "CHECK GENERATED MASTER ICON"
          echo "========================================"

          ls -lh tool/icon.png

          python3 - <<'PY'
          from PIL import Image

          image = Image.open("tool/icon.png")

          print("Icon size:", image.size)
          print("Icon mode:", image.mode)

          if image.size != (1024, 1024):
              raise SystemExit(
                  "ERROR: Icon must be 1024x1024."
              )
          PY

          echo ""
          echo "========================================"
          echo "CHECK ANDROID ICONS"
          echo "========================================"

          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o \
              -name "ic_launcher_round.png" \
            \) \
            -print

      # ============================================================
      # 10. Verify source
      # ============================================================

      - name: Verify launcher configuration
        run: |
          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          grep -n "android:icon" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "========================================"
          echo "ANDROID ROUND ICON"
          echo "========================================"

          grep -n "android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

      # ============================================================
      # 11. Analyze
      # ============================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ============================================================
      # 12. Tests
      # ============================================================

      - name: Flutter tests
        run: |
          flutter test

      # ============================================================
      # 13. Build APK
      # ============================================================

      - name: Build Release APK
        run: |
          flutter build apk --release

      # ============================================================
      # 14. Build AAB
      # ============================================================

      - name: Build Release AAB
        run: |
          flutter build appbundle --release

      # ============================================================
      # 15. Check outputs
      # ============================================================

      - name: Check build outputs
        run: |
          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/

          echo ""
          echo "========================================"
          echo "AAB"
          echo "========================================"

          ls -lh build/app/outputs/bundle/release/

          echo ""
          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum \
            build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 16. Upload artifacts
      # ============================================================

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
