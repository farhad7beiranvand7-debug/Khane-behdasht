name: Build Android Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. دریافت Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # ==========================================
      # 4. ابزار Python
      # ==========================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow


      # ==========================================
      # 5. Flutter
      # ==========================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # 6. بررسی پروژه
      # ==========================================
      - name: Inspect project
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== PUBSPEC ====="
          if [ -f pubspec.yaml ]; then
            echo "pubspec.yaml found"
            cat pubspec.yaml
          else
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi


      # ==========================================
      # 7. اصلاح نام پروژه Dart
      # ==========================================
      - name: Fix Dart package name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")

          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()

          found = False

          for i, line in enumerate(lines):
              if line.startswith("name:"):
                  lines[i] = "name: khane_behdasht"
                  found = True
                  break

          if not found:
              raise SystemExit("ERROR: name field not found in pubspec.yaml")

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Updated pubspec.yaml:")
          print(path.read_text(encoding="utf-8"))
          PY


      # ==========================================
      # 8. ایجاد Android
      # ==========================================
      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then

            echo "Android folder does not exist."
            echo "Creating Android platform..."

            flutter create . \
              --project-name khane_behdasht \
              --org ir.khane.behdasht \
              --platforms android

          else

            echo "Android folder already exists."

          fi


      # ==========================================
      # 9. بررسی Android
      # ==========================================
      - name: Check Android project
        run: |
          echo "===== ANDROID ====="
          ls -la android

          echo "===== GRADLE ====="
          find android -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            -print


      # ==========================================
      # 10. تنظیم Android اختصاصی پروژه
      # ==========================================
      - name: Configure Android
        run: |
          if [ -f "tool/prepare_android.py" ]; then
            echo "Running prepare_android.py"
            python3 tool/prepare_android.py
          else
            echo "prepare_android.py not found."
            echo "Skipping custom Android configuration."
          fi


      # ==========================================
      # 11. ساخت آیکون
      # ==========================================
      - name: Generate application icon
        run: |
          if [ -f "tool/create_icon.py" ]; then
            echo "Running create_icon.py"
            python3 tool/create_icon.py
          else
            echo "create_icon.py not found."
            echo "Skipping custom icon generation."
          fi


      # ==========================================
      # 12. Flutter dependencies
      # ==========================================
      - name: Flutter pub get
        run: |
          flutter pub get


      # ==========================================
      # 13. Analyze
      # ==========================================
      - name: Flutter analyze
        run: |
          flutter analyze


      # ==========================================
      # 14. Tests
      # ==========================================
      - name: Flutter tests
        run: |
          flutter test


      # ==========================================
      # 15. ساخت APK
      # ==========================================
      - name: Build Release APK
        run: |
          flutter build apk --release


      # ==========================================
      # 16. ساخت AAB
      # ==========================================
      - name: Build Release AAB
        run: |
          flutter build appbundle --release


      # ==========================================
      # 17. بررسی خروجی
      # ==========================================
      - name: Check build outputs
        run: |
          echo "================================"
          echo "APK"
          echo "================================"

          ls -lh build/app/outputs/flutter-apk/

          echo "================================"
          echo "AAB"
          echo "================================"

          ls -lh build/app/outputs/bundle/release/


      # ==========================================
      # 18. ذخیره APK و AAB
      # ==========================================
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khane-behdasht-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
